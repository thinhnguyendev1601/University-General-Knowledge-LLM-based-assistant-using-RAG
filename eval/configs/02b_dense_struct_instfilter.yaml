# Step 1+2 of docs/06 §C: structure-aware chunks + bge-m3 dense retrieval, NO generation.
# Measures retrieval only (hit@k, MRR); answers are the raw top chunk, so ignore answer metrics.
run_name: 02b_dense_struct_instfilter
testset: eval/questions/testset.jsonl
split: dev
pipeline: rag.pipeline:build_dense_pipeline
pipeline_kwargs:
  top_k: 10
  llm: none
  institution_filter: true   # rag/institutions.py: filter retrieval to the school named in the question
k_values: [1, 3, 5, 10]
min_overlap_frac: 0.5
out_dir: eval/runs
